name: 配信データ更新
on:
  schedule:
    - cron: '*/20 * * * *'
    - cron: '7 */2 * * *'   # 他チャンネルのコラボ検索（2時間おき）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: streams
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/streams.mjs
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          SEARCH: ${{ github.event_name != 'schedule' || github.event.schedule == '7 */2 * * *' }}
      - name: commit
        run: |
          git add streams.json streams.ics
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'streams: update'
          git pull --rebase
          git push
