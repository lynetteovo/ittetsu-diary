<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="イッテツ手帳">
<meta name="theme-color" content="#0A090B">
<meta name="mobile-web-app-capable" content="yes">
<title>佐伯イッテツ 推し活手帳</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" sizes="180x180" href="icon.png">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 非ブロッキング読み込み：フォントが遅くても画面はすぐ出る -->
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+1+Code:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<script>
function setUserId(id){
  try{localStorage.setItem('saiki-uid',id);}catch(e){}
  try{document.cookie='saiki-uid='+id+';max-age=31536000;path=/';}catch(e){}
}
function getUserId(){
  let id=null;
  try{id=localStorage.getItem('saiki-uid');}catch(e){}
  if(!id){const m=document.cookie.match(/(?:^|;\s*)saiki-uid=([^;]+)/);if(m)id=m[1];}
  if(!id){
    try{id=crypto.randomUUID();}catch(e){id='u'+Date.now()+Math.random().toString(36).slice(2);}
  }
  setUserId(id);
  return id;
}
</script>
<style>
/* ===== 桑 kuwa — Color Hunt 2C2C2C / 853953 / 612D53 / F3F4F4 (colorhunt.co/palette/2c2c2c853953612d53f3f4f4)
   light ground = F3F4F4, ink = 2C2C2C, accent = 853953 (mulberry, next to the official #8C4664), deep = 612D53.
   wash colours (晕染) sampled from the gradient covers: blue-violet / lavender / pink rim / ice / peach. ===== */
:root{color-scheme:dark;
  --void:#0A090B;--ink:#F3F4F4;--ash:#CEC6CF;--dim:#91869A;--faint:#26202B;--chip:rgba(255,255,255,.06);--oshi:#D08DA8;--violet:#612D53;--on-ink:#0E0C0F;
  --glass-bg:rgba(20,15,24,.36);--hi:rgba(255,255,255,.2);--rim:rgba(255,255,255,.5);--sh:rgba(0,0,0,.75);--surface:rgba(255,255,255,.07);--surface2:rgba(255,255,255,.14);--line:rgba(255,255,255,.08);
  --sheet:rgba(16,12,19,.7);--off:#2A2430;--hero-bg:#17131A;--scrim:rgba(0,0,0,.3);--dimf:brightness(.62) saturate(.9);--focus:rgba(255,255,255,.5);--track:rgba(255,255,255,.16);
  --field:176,158,236;--field-a:.62;--smoke1:236,226,244;--smoke2:187,169,242;--veil:#141017;
  --w-violet:#6B5FE0;--w-lav:#AE9BF0;--w-pink:#EE9DC6;--w-ice:#8EBDEB;--w-peach:#FFC2A6;--w-mul:#B8557F;
  --wash:linear-gradient(120deg,#6F64D6 0%,#9C82DF 30%,#C47AAE 62%,#853953 100%);
  --wash-lite:linear-gradient(120deg,#9A90F4 0%,#BCA9F6 32%,#EEA2CB 64%,#D9719B 100%);
  --cs:.78;--cc:.9;}
:root{
  --mono:"M PLUS 1 Code",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --t1:160ms; --t2:320ms; --t3:560ms;
  --ease:cubic-bezier(.2,.8,.2,1);
  --spring:cubic-bezier(.3,1.25,.45,1);
  --spring-b:cubic-bezier(.3,1.45,.45,1);
  --pad:20px;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--void)}
body{background:radial-gradient(120% 60% at 50% 0%,#120E15 0%,#0A090B 60%) fixed,#0A090B}
body{min-height:100dvh;color:var(--ash);font:400 16px/1.6 var(--sans);font-feature-settings:"palt";-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-feature-settings:normal}

/* ===== liquid glass ===== */
.glass{
  isolation:isolate;
  background:linear-gradient(170deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.02) 40%,rgba(255,255,255,.04) 100%),var(--glass-bg);
  -webkit-backdrop-filter:blur(26px) saturate(185%);
  backdrop-filter:blur(26px) saturate(185%);
  box-shadow:
    inset 0 1px 0 var(--hi),
    inset 0 -14px 24px -16px rgba(0,0,0,.6),
    inset 0 0 24px rgba(174,155,240,.05),
    0 1px 1px rgba(0,0,0,.4),
    0 22px 44px -18px var(--sh);
}
.glass::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;
  background:radial-gradient(130% 110% at var(--mx,28%) -35%,rgba(255,255,255,.16),transparent 58%),linear-gradient(115deg,transparent 42%,rgba(255,255,255,.05) 48%,transparent 56%)}
.glass::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(150deg,rgba(255,255,255,.55) 0%,rgba(238,157,198,.42) 24%,rgba(174,155,240,.16) 50%,rgba(142,189,235,.38) 76%,rgba(255,255,255,.3) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.press{transition:transform var(--t2) var(--spring)}
.press:active{transform:scale(.94)}

/* ===== ambient ascii field ===== */
/* 晕染: three soft colour fields that bleed in from the edges. Not spheres — wide, blurred, off-screen. */
#wash{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;transition:opacity 1400ms var(--ease)}
#wash i{position:absolute;display:block;border-radius:50%;will-change:transform;transition:translate 1600ms var(--spring),opacity 900ms var(--ease),scale 1600ms var(--spring)}
#wash .w1{left:-46%;top:-22%;width:min(130vw,640px);height:min(96vw,470px);opacity:.62;
  background:conic-gradient(from var(--wr,200deg) at 58% 54%,var(--w-violet),var(--w-lav),var(--w-pink),#9E8BE6,var(--w-ice),var(--w-violet));
  filter:blur(64px);animation:wspin 70s linear infinite,drift1 34s ease-in-out infinite alternate}
#wash .w2{right:-52%;top:30%;width:min(120vw,600px);height:min(84vw,420px);opacity:.42;
  background:radial-gradient(closest-side at 40% 45%,var(--w-mul),rgba(241,170,205,.8) 45%,rgba(255,205,180,.55) 75%,transparent);
  filter:blur(56px);animation:drift2 42s ease-in-out infinite alternate}
#wash .w3{left:-30%;bottom:-26%;width:min(120vw,560px);height:min(80vw,380px);opacity:.4;
  background:radial-gradient(closest-side at 55% 45%,var(--w-ice),rgba(187,169,242,.7) 55%,rgba(191,234,216,.45) 80%,transparent);
  filter:blur(60px);animation:drift1 50s ease-in-out infinite alternate-reverse}
@property --wr{syntax:'<angle>';inherits:false;initial-value:200deg}
@keyframes wspin{to{--wr:560deg}}
@keyframes drift1{to{transform:translate(60px,70px) scale(1.1)}}
@keyframes drift2{to{transform:translate(-70px,-50px) scale(.94)}}
/* the wash rearranges itself when you switch pages */
body.view-log #wash .w1{translate:62vw 2vh;scale:.86}
body.view-log #wash .w2{translate:-70vw 22vh}
body.view-log #wash .w3{translate:40vw -6vh}
body.booting #wash{opacity:.0}
body.booting.boot-in #wash{opacity:.85}
#grain{position:fixed;inset:-50%;z-index:85;pointer-events:none;background:var(--grain);opacity:.12;mix-blend-mode:overlay;animation:grainShift 1.2s steps(4) infinite}
@keyframes grainShift{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
#bloom{position:fixed;inset:-12%;z-index:30;pointer-events:none;opacity:0;background:transparent center/cover no-repeat;filter:blur(40px);transition:opacity 700ms var(--ease)}
body.sheet-open #bloom{opacity:.5}
#scrim{position:fixed;inset:0;z-index:35;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity var(--t3) var(--ease)}
body.sheet-open #scrim{opacity:1;pointer-events:auto}

/* ===== top bar ===== */
#topbar{position:fixed;z-index:20;top:calc(var(--st) + 10px);left:50%;width:min(500px,calc(100% - 20px));height:56px;border-radius:28px;
  display:flex;align-items:center;justify-content:space-between;padding:0 6px 0 8px;transform:translateX(-50%);
  transition:opacity var(--t3) var(--ease),transform var(--t3) var(--spring),-webkit-backdrop-filter 700ms var(--ease),backdrop-filter 700ms var(--ease)}
.who{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:500;font-size:15px}
.who img{width:40px;height:40px;border-radius:50%;object-fit:cover;display:block}
.top-actions{display:flex;gap:4px;align-items:center}
.today-btn{height:44px;padding:0 18px;border-radius:22px;font-size:14px;color:var(--ink);font-weight:500;background:var(--surface);box-shadow:inset 0 1px 0 var(--hi)}
.cloud{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.cloud i{width:8px;height:8px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 3px var(--surface)}
.cloud.ok i{background:var(--oshi)}
.cloud.busy i{animation:pulse 900ms ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.5);opacity:.4}}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ash)}
.icon-btn svg{width:22px;height:22px}
body.sheet-open #topbar{opacity:0;transform:translateX(-50%) translateY(-10px) scale(.96);pointer-events:none}

/* ===== page ===== */
#page{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:calc(var(--st) + 92px) var(--pad) calc(var(--sb) + 132px);
  transition:transform var(--t3) var(--spring),filter var(--t3) var(--ease),opacity 500ms var(--ease)}
body.sheet-open{overflow:hidden}
body.sheet-open #page{transform:scale(.93);filter:var(--dimf)}
.view[hidden]{display:none}

/* month head */
.month-head{display:grid;grid-template-columns:auto 1fr;column-gap:20px;align-items:stretch}
.bignum{display:grid;grid-template-columns:repeat(11,9px);grid-auto-rows:12px;gap:1px;font:700 8px/12px var(--mono);text-align:center;user-select:none}
.bignum span{border-radius:2px;color:var(--off);transition:background-color 240ms var(--ease),color 240ms var(--ease)}
.bignum span.on{background:var(--ink);color:var(--on-ink);box-shadow:inset 0 -1px 0 rgba(0,0,0,.16)}
.month-meta{display:flex;flex-direction:column;justify-content:space-between;min-width:0}
.mrow{display:flex;justify-content:space-between;align-items:flex-start}
.year{font:400 12px/1 var(--mono);color:var(--dim);padding-top:4px}
.tally{display:flex;gap:22px}
.tally dt{white-space:nowrap}
.tally dt{font-size:12px;color:var(--dim);line-height:1.2}
.tally dd{font:500 21px/1 var(--mono);color:var(--ink);margin-top:4px}
.tally .left dd{color:var(--oshi);transition:color var(--t2)}
.tally .left.zero dd{color:var(--dim)}
.month-nav{display:flex;gap:8px}
.round{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font:500 18px/1 var(--mono)}
.round svg{width:18px;height:18px}

/* odometer */
.odo{display:inline-flex;height:var(--oh,1em);overflow:hidden;font-family:var(--mono);vertical-align:bottom}
.oc{display:block;height:var(--oh,1em);overflow:hidden}
.os{display:block;white-space:pre;line-height:var(--oh,1em);transition:transform 760ms var(--spring-b)}

/* hero (next stream) */
.hero-wrap{position:relative;margin-top:24px}
.hero-wrap[hidden]{display:none}
.hero-bleed{position:absolute;left:6%;right:6%;top:18%;bottom:-12%;border-radius:40px;background:center/cover no-repeat;filter:blur(30px) saturate(1.35);opacity:0;transition:opacity 900ms var(--ease)}
.hero-bleed.on{opacity:.5}
.hero{position:relative;display:block;width:100%;aspect-ratio:2.3/1;margin-top:0;border-radius:24px;overflow:hidden;background:var(--hero-bg);text-align:left;color:var(--ink)}
.hero .thumb{position:absolute;inset:0;border-radius:0;aspect-ratio:auto}
.cap{position:absolute;left:8px;right:8px;bottom:8px;padding:10px 16px 12px;border-radius:17px}
.cap .when{font-size:12px;color:var(--ash);line-height:1.4}
.cap .when .live{color:var(--oshi);font-weight:500}
.cap .cig{margin:10px 0 2px}
.hero canvas.smk{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.cap .ttl{font-size:15px;font-weight:500;line-height:1.45;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

/* thumbnails */
.thumb{position:relative;overflow:hidden;border-radius:16px;background:var(--hero-bg);aspect-ratio:16/9}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;filter:saturate(var(--cs,.78)) contrast(var(--cc,.9)) brightness(.96)}
.thumb canvas{position:absolute;inset:0;width:100%;height:100%}
.thumb::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,0) 32%),radial-gradient(125% 95% at 50% 42%,transparent 56%,rgba(0,0,0,.36));box-shadow:inset 0 0 0 1px rgba(255,255,255,.09),inset 0 1px 0 rgba(255,255,255,.16)}
.hero{box-shadow:0 1px 1px rgba(0,0,0,.4),0 26px 48px -22px rgba(0,0,0,.8)}
.hero .cap{z-index:2}

/* filter pills */
.pills{position:relative;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:22px calc(var(--pad) * -1) 14px;padding:2px var(--pad)}
.pills::-webkit-scrollbar{display:none}
.pill{position:relative;z-index:1;flex:none;height:40px;padding:0 16px;border-radius:20px;background:var(--chip);box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.04);color:var(--ash);font-size:14px;display:inline-flex;align-items:center;gap:8px;transition:color var(--t2) var(--ease),background-color var(--t2) var(--ease)}
.pill .gl{font-family:var(--mono);color:var(--dim);transition:color var(--t2)}
.pills .pill[aria-checked="true"]{color:var(--on-ink);background:transparent;box-shadow:none}
.pills .pill[aria-checked="true"] .gl{color:var(--on-ink)}
.pill-ind{position:absolute;z-index:0;top:2px;left:0;height:40px;border-radius:20px;background:var(--ink);pointer-events:none;box-shadow:0 6px 16px -8px rgba(0,0,0,.6)}

/* calendar */
.wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--dim);text-align:center;padding-bottom:6px}
.gridwrap{touch-action:pan-y}
.grid{position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:56px;row-gap:2px}
.cell{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding-top:7px;gap:5px;border-radius:18px;transition:opacity var(--t2) var(--ease)}
.cell[disabled]{cursor:default}
.cell .n{display:grid;place-items:center;min-width:32px;height:26px;padding:0 4px;border-radius:13px;font:500 16px/1 var(--mono);color:var(--ink);transition:background-color var(--t2),color var(--t2)}
.cell.today .n{background:var(--ink);color:var(--on-ink)}
.cell .g{display:flex;gap:3px;height:13px;font:500 12px/13px var(--mono)}
.cell .g span{transition:color var(--t2) var(--ease),opacity var(--t2)}
.g .u{color:var(--oshi)}
.g .w{color:var(--dim)}
.g .o{color:var(--ash)}
.g .pop{animation:pop 520ms var(--spring-b) both}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.cell .s{position:absolute;top:3px;right:2px;font-size:10px;line-height:1}
.cell.fade{opacity:.16}
.lens{position:absolute;z-index:2;left:0;top:0;width:var(--lw,46px);height:54px;pointer-events:none;opacity:0;
  transform:translate(var(--x,0),var(--y,0)) scale(.5);
  transition:transform 460ms var(--spring),opacity 200ms var(--ease)}
.lens.on{opacity:1;transform:translate(var(--x,0),var(--y,0)) scale(1)}
.lens-b{position:absolute;inset:0;border-radius:19px;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:3px}
.lens-n{font:700 22px/30px var(--mono);color:var(--ink)}
.lens .g{display:flex;gap:3px;height:13px;font:500 12px/13px var(--mono)}

#clear{position:fixed;z-index:45;left:50%;top:38%;transform:translate(-50%,-50%);font:500 14px/1.35 var(--mono);color:var(--ink);white-space:pre;pointer-events:none;opacity:0;text-align:left}

/* ===== log view ===== */
.log-title{font-size:21px;font-weight:700;color:var(--ink);line-height:1.3}
.score{display:flex;align-items:baseline;gap:6px;margin-top:22px;font:500 60px/1 var(--mono);color:var(--ink)}

.score .slash,.score .tot{color:var(--dim)}
.score-cap{font-size:14px;color:var(--dim);margin-top:8px}
.abar{display:flex;margin-top:12px;font:400 14px/1 var(--mono)}
.abar span{display:block;width:.62em;text-align:center;color:var(--faint);transition:color 90ms linear}
.abar{letter-spacing:0}
.abar.go span.f{color:var(--ink)}
.abar.pink.go span.f{color:var(--oshi)}
.log h3{font-size:14px;font-weight:500;color:var(--ash);margin:40px 0 12px}
.trow{display:grid;grid-template-columns:22px 5.5em 1fr 2.2em;align-items:center;height:36px;font-size:14px}
.trow .gl{font-family:var(--mono);color:var(--dim)}
.trow .abar{margin:0}
.trow .num{font-family:var(--mono);text-align:right;color:var(--ink)}
.games{list-style:none}
.games li{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;color:var(--ink)}
.games li span:last-child{font-family:var(--mono);color:var(--dim);flex:none}
.spend{font:500 28px/1 var(--mono);color:var(--ink)}
.arcade{margin-top:44px;font:400 13px/1.5 var(--mono);color:var(--ash);white-space:pre}
.arcade .odo{color:var(--ink);--oh:1.5em}
.arcade-cap{font-size:12px;color:var(--dim);margin-top:6px}

/* ===== tab bar + cat ===== */
#tabbar{position:fixed;z-index:20;left:50%;bottom:calc(var(--sb) + 18px);display:flex;padding:5px 5px 5px 86px;border-radius:30px;transform:translateX(-50%);
  transition:transform var(--t3) var(--spring),opacity var(--t2) var(--ease),-webkit-backdrop-filter 700ms var(--ease),backdrop-filter 700ms var(--ease)}
.tab{position:relative;z-index:1;height:46px;padding:0 20px;white-space:nowrap;border-radius:23px;font-size:15px;font-weight:500;color:var(--dim);transition:color var(--t2) var(--ease)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab-ind{position:absolute;z-index:0;top:5px;left:0;height:46px;border-radius:23px;background:var(--surface2);box-shadow:inset 0 1px 0 var(--hi),inset 0 0 0 1px var(--surface)}
body.sheet-open #tabbar{transform:translateX(-50%) translateY(140%);opacity:0}

#cat{position:fixed;z-index:21;left:0;bottom:0;padding:2px 4px;color:var(--ink);transition:opacity var(--t2)}
#cat.moving{transition:opacity var(--t2),bottom 420ms var(--spring-b)}
#cat.perched{position:absolute;right:26px;left:auto!important;bottom:100%!important;top:auto}
#catArt{font:500 11px/1.08 var(--mono);white-space:pre;pointer-events:none;text-shadow:0 0 3px var(--void),0 0 6px var(--void),0 0 10px var(--void)}
#catArt .pw{display:inline-block}
#catArt .pw.up{transform:translateY(-1.5px)}
#cat.hop{animation:hop 420ms var(--spring-b)}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-9px)}100%{transform:translateY(0)}}
#bubble{position:fixed;z-index:46;left:0;top:0;padding:8px 14px;border-radius:16px;font-size:13px;color:var(--ink);white-space:nowrap;pointer-events:none;opacity:0;transform:translateY(6px) scale(.85);transform-origin:20% 100%;transition:opacity 200ms var(--ease),transform 420ms var(--spring-b)}
#bubble.on{opacity:1;transform:none}

/* ===== sheets ===== */
.sheet{position:fixed;z-index:40;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:82dvh;border-radius:32px 32px 0 0;display:flex;flex-direction:column;
  background:var(--sheet);padding-bottom:var(--sb);
  transform:translateY(calc(100% + 60px));visibility:hidden;
  transition:transform var(--t3) var(--spring),filter var(--t3) var(--ease),visibility 0s linear var(--t3)}
.sheet.open{transform:none;visibility:visible;transition:transform var(--t3) var(--spring),filter var(--t3) var(--ease),visibility 0s}
.sheet.glass::before{background:radial-gradient(120% 60% at var(--mx,28%) -20%,rgba(255,255,255,.12),transparent 60%)}

.grab{flex:none;height:26px;display:grid;place-items:center;cursor:grab;touch-action:none}
.grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--track)}
.sheet-head{flex:none;display:flex;align-items:flex-end;justify-content:space-between;padding:0 20px 14px;touch-action:none}

.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 20px 28px;-webkit-overflow-scrolling:touch}
.stickers{display:flex;gap:6px;padding:0 20px 12px;font-size:22px;min-height:0}
.stickers:empty{display:none}
.stickers span{display:inline-block;animation:pop 520ms var(--spring-b) both}
.stk-picker{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:0 20px 16px;padding:8px;border-radius:20px;background:var(--surface)}
.stk-picker[hidden]{display:none}
.stk-picker button{height:44px;border-radius:14px;font-size:22px;opacity:.55;transition:opacity var(--t1),background-color var(--t1)}
.stk-picker button[aria-pressed="true"]{opacity:1;background:var(--surface2)}
.ev{padding:14px 0 16px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0;padding-top:0}
.ev .thumb{margin-bottom:12px;aspect-ratio:2.2/1}
.ev-row{display:grid;grid-template-columns:44px 1fr auto;column-gap:8px;align-items:start}
.check{width:44px;height:44px;margin:-10px 0 0 -10px;font:500 16px/44px var(--mono);color:var(--oshi);text-align:center;white-space:pre}
.ev.done .check{color:var(--dim)}
.ev-glyph{font:500 16px/24px var(--mono);color:var(--dim);text-align:left;padding-left:2px}
.ev-title{font-size:16px;font-weight:500;color:var(--ink);line-height:1.5;transition:color var(--t2)}
.ev.done .ev-title{color:var(--ash)}
.ev-meta{font-size:13px;color:var(--dim);margin-top:2px}
.ev-note{font-size:14px;color:var(--ash);margin-top:8px;line-height:1.7}
.ev .round{background:var(--surface);width:40px;height:40px}
.ev-btns{display:flex;flex-direction:column;gap:6px;margin-top:-6px}
.ev-btns svg{width:16px;height:16px}
.ev.enter{animation:enter 560ms var(--spring) both}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.plus1{position:fixed;z-index:60;font:700 15px/1 var(--mono);color:var(--oshi);pointer-events:none}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:14px;padding:6px 0 10px}
.empty pre{font:500 13px/1.15 var(--mono);color:var(--dim)}
.empty p{color:var(--ash);font-size:15px}
.primary{height:48px;padding:0 24px;border-radius:24px;background:var(--ink);color:var(--on-ink);font-weight:700;font-size:15px}
.ghost{height:48px;padding:0 22px;border-radius:24px;background:var(--surface);color:var(--ink);font-weight:500;font-size:15px}
.danger{height:44px;padding:0 6px;font-size:14px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}

/* form */
.form{padding:0 20px 24px;overflow-y:auto}
.form h2{outline:none;font-size:21px;color:var(--ink);font-weight:700;margin-bottom:18px}
.type-pills{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.type-pills .pill{height:40px}
.type-pills .pill[aria-checked="true"]{background:var(--ink);color:var(--on-ink)}
.type-pills .pill[aria-checked="true"] .gl{color:var(--on-ink)}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:13px;color:var(--dim);margin-bottom:6px}
.field input,.field textarea{width:100%;border:0;border-radius:14px;background:var(--surface);padding:12px 14px;font-size:16px;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow var(--t2)}
.field[hidden]{display:none}
.field .yen{display:flex;align-items:center;gap:8px}
.field .yen b{font:500 18px var(--mono);color:var(--ink)}
.thumb-pick{display:flex;align-items:center;justify-content:center;gap:8px;height:56px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;color:var(--dim);cursor:pointer;border:1.5px dashed var(--track)}
.thumb-prev{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:2.2/1}
.thumb-prev img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-prev button{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;background:var(--glass-bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--ink);font-size:16px}
.wrow{display:flex;align-items:center;justify-content:space-between;min-height:52px;margin-bottom:10px;font-size:15px;color:var(--ink);width:100%;text-align:left}
.wrow[hidden]{display:none}
.field input:focus,.field textarea:focus{box-shadow:inset 0 0 0 1.5px var(--focus)}
.field textarea{resize:none;line-height:1.6}
.form-actions{display:flex;gap:10px;margin-top:6px}
.form-actions .primary{flex:1}

/* settings */
.set-list{list-style:none;padding:0 20px 28px;overflow-y:auto}
.set-list h2{outline:none;font-size:21px;color:var(--ink);font-weight:700;margin-bottom:12px}
.set-row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:54px;font-size:16px;color:var(--ink);text-align:left;border-bottom:1px solid var(--line)}
.set-row small{display:block}
.seg{display:flex;padding:3px;border-radius:20px;background:var(--surface)}
.seg button{height:34px;padding:0 14px;border-radius:17px;font-size:13px;color:var(--ash)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--on-ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:15px;color:var(--ink);margin:6px 0 18px}
.kv dt{color:var(--dim)}
.kv dd{font-family:var(--mono);text-align:right}
.code{font:500 15px/1.5 var(--mono);color:var(--ink);padding:12px 14px;border-radius:14px;background:var(--surface);word-break:break-all;margin:8px 0 14px}
.set-row small{color:var(--dim);font-size:13px}
.switch{flex:none;width:52px;height:32px;border-radius:16px;background:var(--track);position:relative;transition:background-color var(--t2)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform var(--t2) var(--spring-b)}
[aria-checked="true"] .switch{background:var(--oshi)}
[aria-checked="true"] .switch::after{transform:translateX(20px)}
.set-note{font-size:13px;color:var(--dim);line-height:1.8;margin-top:18px}

/* toast */
#toast{position:fixed;z-index:70;left:50%;bottom:calc(var(--sb) + 96px);padding:10px 18px;border-radius:20px;font-size:14px;color:var(--ink);pointer-events:none;opacity:0;transform:translateX(-50%) translateY(10px);transition:opacity 220ms var(--ease),transform 420ms var(--spring)}
#toast.on{opacity:1;transform:translateX(-50%)}

/* ===== boot ===== */
#boot{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:24px}
#boot[hidden]{display:none}
#bootCat{font:500 20px/1.1 var(--mono);color:var(--ink);white-space:pre;transform-origin:0 0}
#bootCat .row{display:block;height:1.1em}
#bootCat span{display:inline-block;width:1ch}
#bootCat span.drop{animation:drop 620ms var(--spring-b) both}
@keyframes drop{from{opacity:0;transform:translateY(-46px)}to{opacity:1;transform:none}}
.boot-log{width:min(300px,86vw);font:400 13px/1.6 var(--mono);color:var(--ash);min-height:4.8em}
.boot-log .bar{display:flex;margin-top:4px;align-items:center;gap:10px}
.boot-log .bar .abar{margin:0}
.boot-log .pct{color:var(--dim);width:3em}

#bootMsg{font:500 21px/1.3 var(--sans);color:var(--ink);min-height:1.3em}
#bootHint{position:absolute;bottom:calc(var(--sb) + 28px);font-size:12px;color:var(--dim);opacity:0;transition:opacity 400ms}
body.booting #page{opacity:0}
body.booting #topbar{opacity:0;transform:translateX(-50%) translateY(-6px) scale(1.06);-webkit-backdrop-filter:blur(0) saturate(100%);backdrop-filter:blur(0) saturate(100%)}
body.booting #tabbar{opacity:0;transform:translateX(-50%) translateY(10px) scale(1.06);-webkit-backdrop-filter:blur(0) saturate(100%);backdrop-filter:blur(0) saturate(100%)}
body.booting #cat{opacity:0}

/* ===== the cigarette (white super-slim, mint line, purple capsule dot) ===== */
.cig{position:relative;display:flex;align-items:center;height:9px;width:100%;filter:drop-shadow(0 5px 5px rgba(0,0,0,.5)) drop-shadow(0 1px 0 rgba(0,0,0,.3))}
.cig .burnt{height:1px;flex:none;width:calc(78% * (1 - var(--rem,1)));background:repeating-linear-gradient(90deg,var(--dim) 0 2px,transparent 2px 7px);opacity:.7;transition:width 1200ms var(--spring)}
.cig .paper{position:relative;flex:none;height:100%;width:calc(78% * var(--rem,1));background:repeating-linear-gradient(90deg,rgba(60,40,50,.035) 0 1px,transparent 1px 3px),linear-gradient(180deg,#fff 0%,#FDFBFC 30%,#EEE8EC 64%,#CEC5CB 100%);transition:width 1200ms var(--spring)}
.cig .tip{position:absolute;left:-1px;top:0;bottom:0;width:6px;border-radius:2px 0 0 2px;background:linear-gradient(90deg,#9A9095 0 30%,#F19A6E 60%,#E2382E 100%);box-shadow:0 0 8px 2px rgba(242,130,90,.45);animation:ember 2s ease-in-out infinite}
@keyframes ember{0%,100%{box-shadow:0 0 8px 2px rgba(242,130,90,.45)}23%{box-shadow:0 0 14px 4px rgba(242,130,90,.62)}31%{box-shadow:0 0 9px 2px rgba(242,130,90,.48)}58%{box-shadow:0 0 16px 5px rgba(246,140,96,.66)}}
.cig .filter{position:relative;flex:1;height:100%;border-radius:0 5px 5px 0;background-image:var(--grain),linear-gradient(180deg,#FFFEFB 0%,#F6F1EA 34%,#E7DFD6 66%,#C8BEB4 100%);background-blend-mode:soft-light,normal;box-shadow:inset 1px 0 0 rgba(0,0,0,.08)}
.cig .ash{position:absolute;right:100%;top:.5px;bottom:.5px;width:15px;border-radius:4px 0 0 4px;background:repeating-linear-gradient(90deg,#7E767B 0 1.5px,#A69EA3 1.5px 3.5px,#8F878C 3.5px 4.5px),linear-gradient(180deg,#B9B1B6,#6F686C);background-blend-mode:multiply;opacity:.92}
.cig .ash::before{content:"";position:absolute;left:3px;top:1px;width:2px;height:60%;background:rgba(255,255,255,.25);border-radius:1px}
.cig.out .burnt{width:0}
.cig.out .ash{display:none}
.cig.out .tip{width:3px;left:0;border-radius:2px 0 0 2px;background:radial-gradient(circle at 50% 50%,#D2A878 0 .8px,transparent 1.2px) 0 0/2.5px 2.5px,#9B7350;box-shadow:none;animation:none}
.cig .mint{position:absolute;left:7%;top:0;bottom:0;width:1.5px;background:#BFE3D4}
.cig .cdot{position:absolute;left:38%;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#E9D8F2,#8C4664)}
.lhead{position:relative}
.lhead>*:not(canvas){position:relative;z-index:1}
#logSmk{position:absolute;left:-20px;right:-20px;top:-170px;bottom:0;width:calc(100% + 40px);height:calc(100% + 170px);z-index:0;pointer-events:none}
.lcig{margin-top:26px;padding-right:16px}
.lcig .cig{height:13px;flex-direction:row-reverse}
.lcig .cig .filter{border-radius:5px 0 0 5px;box-shadow:inset -1px 0 0 rgba(0,0,0,.08)}
.lcig .cig .paper::after{content:"";position:absolute;right:0;top:0;bottom:0;width:6px;background:linear-gradient(270deg,rgba(84,66,68,.6) 0 1px,rgba(214,196,186,.5) 1px,transparent 6px)}
.lcig .cig .tip{left:auto;right:-2px;width:2px;border-radius:0;background:linear-gradient(180deg,#FFC2A0,#FF7A4A 45%,#E0452C);box-shadow:0 0 3px 1px rgba(255,120,74,.6),0 0 10px 1px rgba(255,96,60,.22);animation:ember2 2.6s ease-in-out infinite}
@keyframes ember2{0%,100%{filter:brightness(.92)}40%{filter:brightness(1.18)}62%{filter:brightness(.98)}}
.lcig .cig .ash{right:auto;left:calc(100% + 2px);top:.5px;bottom:.5px;width:9px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,#E6E2E4 0%,#CBC6C9 42%,#99949A 100%);background-blend-mode:normal;opacity:1}
.lcig .cig .ash::before{display:none}
.lcig .cig.out .paper::after{display:none}
.lcig .cig.out .tip{left:auto;right:0;width:2px;border-radius:0;background:linear-gradient(180deg,#D8B892,#A47E5C);box-shadow:none;animation:none}
.lcig .cig .mint{left:auto;right:7%}
.lcig .cig .cdot{left:auto;right:38%}
.lcig .cig .burnt{background:rgba(255,255,255,.1);opacity:1}
.lcig .cig .filter{flex:none;width:23%}
.foot{font:400 10px/1 var(--mono);letter-spacing:.12em;color:var(--dim);text-align:center;margin-top:44px;opacity:.8}
.remain{font:400 13px var(--mono);color:var(--dim);margin-top:10px}


/* ---- calendar cells carry the day's items ---- */
.grid{grid-auto-rows:80px}
.cell{gap:4px;padding:6px 1px 0;min-width:0;overflow:hidden}
.cell .g,.lens .g{display:flex;flex-direction:column;align-items:stretch;gap:2px;height:auto;width:100%;min-width:0;font:500 10px/1.3 var(--sans);font-feature-settings:"palt"}
.g .lb{display:block;min-width:0;white-space:nowrap;overflow:hidden;text-align:left;padding:1px 2px 1px 3px;border-radius:4px;background:rgba(255,255,255,.05);-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.g .lb i{font-style:normal;font-family:var(--mono);margin-right:2px;opacity:.7}
.g .lb.u{color:var(--oshi);background:rgba(218,134,166,.14)}

.g .more{font:500 10px/1.1 var(--mono);color:var(--dim);text-align:center}
.lens{height:78px}
.lens-b{padding-top:4px;gap:4px}
.lens-n{font-size:20px;line-height:26px}
/* ---- all-time totals: two plain numbers ---- */
.alltime{display:flex;gap:40px;margin-top:2px}
.alltime>div{display:flex;flex-direction:column;gap:8px}
.alltime .odo{font:500 34px/1 var(--mono);color:var(--ink);--oh:1em}

/* ---- calendar labels, calmer ---- */
.cell[hidden]{display:none}
.cell .g,.lens .g{font:500 10.5px/1.3 var(--sans);gap:3px}
.g .lb{position:relative;padding:0 1px 0 5px;border-radius:0;background:none}

.g .lb.u{background:none}

.g .lb.one{white-space:normal;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;-webkit-mask-image:none;mask-image:none}
.cell.rest .n{opacity:.4}
.cell.rest .g::after{content:"休";display:block;text-align:center;font-size:10px;letter-spacing:.2em;color:var(--dim);opacity:.8}
/* ===== reduced motion ===== */
.rm *,.rm *::before,.rm *::after{transition-duration:1ms!important;animation-duration:1ms!important;transition-delay:0ms!important;animation-delay:0ms!important}

/* ===== production additions ===== */
.cloud.err i{background:#E2382E}
.cloud.off i{background:transparent;box-shadow:inset 0 0 0 1.5px var(--dim),0 0 0 3px var(--surface)}
#updBtn{position:fixed;z-index:60;top:calc(var(--st) + 76px);left:50%;transform:translateX(-50%);height:40px;padding:0 18px;border-radius:20px;font-size:13px;font-weight:500;color:var(--ink);white-space:nowrap}
#updBtn[hidden]{display:none}
body.booting #updBtn,body.sheet-open #updBtn{opacity:0;pointer-events:none}

/* ---------- spring easing (CSS linear()) ---------- */
function spring(k,c){let x=0,v=0;const dt=1/120,xs=[0];for(let i=0;i<2400;i++){v+=(-k*(x-1)-c*v)*dt;x+=v*dt;xs.push(x);if(i>30&&Math.abs(x-1)<4e-4&&Math.abs(v)<4e-3)break;}
  const N=40,pts=[];for(let i=0;i<=N;i++)pts.push(+xs[Math.round(i/N*(xs.length-1))].toFixed(4));pts[N]=1;return `linear(${pts.join(',')})`;}

const _wkCache={};
function dayKey2WeekKey(dateStr){
  if(_wkCache[dateStr])return _wkCache[dateStr];
  return _wkCache[dateStr]=_weekKey(dateStr);
}
function _weekKey(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const target=new Date(d.valueOf());
  const dayNr=(d.getDay()+6)%7;
  target.setDate(target.getDate()-dayNr+3);
  const firstThursday=target.valueOf();
  target.setMonth(0,1);
  if(target.getDay()!==4){target.setMonth(0,1+((4-target.getDay())+7)%7);}
  const wk=1+Math.ceil((firstThursday-target)/604800000);
  return d.getFullYear()+'-W'+String(wk).padStart(2,'0');
}

// ===== ローカル保存（IndexedDB。localStorageの5MB上限でサムネが入らない問題を回避） =====
const IDB={db:null,
  open(){return new Promise((res,rej)=>{
    let r;try{r=indexedDB.open('ittetsu-diary',1);}catch(e){return rej(e);}
    const t=setTimeout(()=>rej(new Error('idb timeout')),3000);
    r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>{clearTimeout(t);IDB.db=r.result;res(r.result);};
    r.onerror=()=>{clearTimeout(t);rej(r.error);};
  });},
  get(k){return new Promise((res,rej)=>{const q=IDB.db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});},
  put(k,v){return new Promise((res,rej)=>{const tx=IDB.db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
};
let persistTimer=null;

  }
}
function persistLocal(){
  if(persistTimer)clearTimeout(persistTimer);
  persistTimer=setTimeout(writeLocal,250);
}
async function openLocal(){
  let st=null;
  try{
    await IDB.open();
    st=await IDB.get('state');
    const iu=await IDB.get('uid');

  if(st&&st.e){
    S.events=st.e;S.stickers=st.s||{};S.su=st.su||{};S.dead=st.x||{};
    M=Object.assign(M,st.m||{});
    return;
  }
  // 旧版のlocalStorageキャッシュから移行
  try{
    const d=JSON.parse(localStorage.getItem('saiki-pwa-v1'));
    if(d&&d.e){S.events=d.e||{};S.stickers=d.s||{};}
  }catch(e){}
  if(IDB.db)writeLocal();
}

// ===== Firestore REST（SDK 340KB を読み込まない・WebChannel を使わない） =====
const FS_KEY='AIzaSyBvt72qiRztkWFxnWliAs7RL6Q3iCUoJW4';
const FS_DOCS='projects/ittetsu-diary/databases/(default)/documents';
const FS_URL='https://firestore.googleapis.com/v1/';
const FULL_EVERY=3*864e5;
function fsEnc(v){
  if(v===null||v===undefined)return{nullValue:null};
  if(typeof v==='boolean')return{booleanValue:v};
  if(typeof v==='number')return Number.isInteger(v)?{integerValue:String(v)}:{doubleValue:v};
  if(typeof v==='string')return{stringValue:v};
  if(Array.isArray(v))return{arrayValue:{values:v.map(fsEnc)}};
  return{mapValue:{fields:fsFields(v)}};
}
function fsFields(o){const f={};Object.keys(o).forEach(k=>{if(o[k]!==undefined)f[k]=fsEnc(o[k]);});return f;}
function fsDec(x){
  if(!x)return null;
  if('stringValue' in x)return x.stringValue;
  if('integerValue' in x)return Number(x.integerValue);
  if('doubleValue' in x)return x.doubleValue;
  if('booleanValue' in x)return x.booleanValue;
  if('timestampValue' in x)return x.timestampValue;
  if('arrayValue' in x)return (x.arrayValue.values||[]).map(fsDec);
  if('mapValue' in x)return fsObj(x.mapValue.fields);
  return null;
}
function fsObj(f){const o={};Object.keys(f||{}).forEach(k=>{o[k]=fsDec(f[k]);});return o;}
const docName=(...p)=>FS_DOCS+'/'+p.join('/');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function fsFetch(path,body,timeoutMs){
  const ctl=new AbortController();
  const t=setTimeout(()=>ctl.abort(),timeoutMs||20000);
  try{
    const opt={signal:ctl.signal};
    // text/plain = CORS「単純リクエスト」→ プリフライトの往復が要らない
    if(body!==undefined){opt.method='POST';opt.headers={'Content-Type':'text/plain'};opt.body=JSON.stringify(body);}
    const r=await fetch(FS_URL+path+(path.includes('?')?'&':'?')+'key='+FS_KEY,opt);
    const txt=await r.text();
    let j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
    if(!r.ok){
      const er=new Error((j&&j.error&&j.error.message)||('HTTP '+r.status));
      er.code=(j&&j.error&&j.error.status)||String(r.status);er.http=r.status;throw er;
    }
    return j;
  }catch(e){
    if(e.name==='AbortError'){const er=new Error('timeout');er.code='timeout';throw er;}
    throw e;
  }finally{clearTimeout(t);}
}
async function fsRetry(fn){
  for(let i=0;;i++){
    try{return await fn();}
    catch(e){
      if(e.http&&e.http<500&&e.http!==429)throw e;
      if(i>=2)throw e;
      await sleep([700,2500][i]);
    }
  }
}
async function fsList(path,mask){
  let out=[],tok='';
  do{
    let q=FS_DOCS+'/'+path+'?pageSize=300';
    (mask||[]).forEach(f=>q+='&mask.fieldPaths='+encodeURIComponent(f));
    if(tok)q+='&pageToken='+encodeURIComponent(tok);
    const j=await fsRetry(()=>fsFetch(q));
    out=out.concat((j&&j.documents)||[]);tok=(j&&j.nextPageToken)||'';
  }while(tok);
  return out;
}
async function fsChangedWeeks(uid,since){
  const j=await fsRetry(()=>fsFetch(docName('diaries',uid)+':runQuery',{structuredQuery:{from:[{collectionId:'weeks'}],
    where:{fieldFilter:{field:{fieldPath:'u'},op:'GREATER_THAN_OR_EQUAL',value:{timestampValue:since}}}}}));
  return (j||[]).filter(r=>r.document).map(r=>r.document);
}
async function fsBatchGet(names){
  const j=await fsRetry(()=>fsFetch(FS_DOCS+':batchGet',{documents:names},120000));
  return (j||[]).filter(r=>r.found).map(r=>r.found);
}
const fsCommit=writes=>fsFetch(FS_DOCS+':commit',{writes},120000);
const lastSeg=n=>n.slice(n.lastIndexOf('/')+1);
function hashStr(s){let h=0x811c9dc5;for(let i=0;i<s.length;i+=7){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36)+s.length.toString(36);}
const isData=t=>typeof t==='string'&&t.startsWith('data:');

// ===== マージ（イベント単位で新しい方を採用・削除も同期） =====
function eventIndex(){const idx=new Map();Object.keys(S.events).forEach(dk=>(S.events[dk]||[]).forEach(ev=>idx.set(ev.id,dk)));return idx;}
function mergeEv(ev,dk,idx){
  const dd=S.dead[ev.id];
  if(dd&&(ev.u||0)<=dd.u)return false;
  const curDk=idx.get(ev.id);
  if(curDk===undefined){(S.events[dk]=S.events[dk]||[]).push(ev);idx.set(ev.id,dk);return true;}
  const list=S.events[curDk];const i=list.findIndex(v=>v.id===ev.id);const cur=list[i];
  const eu=ev.u||0,cu=cur.u||0;
  if(eu>cu){
    const nv={...ev};
    if(!nv.thumb&&nv.th&&cur.th===nv.th&&cur.thumb)nv.thumb=cur.thumb;
    if(curDk===dk)list[i]=nv;
    else{list.splice(i,1);(S.events[dk]=S.events[dk]||[]).push(nv);idx.set(ev.id,dk);}
    return true;
  }
  if(eu===cu&&!cur.thumb&&ev.thumb){cur.thumb=ev.thumb;return true;}
  return false;
}
function applyDocs(docs){
  const idx=eventIndex();
  let changed=false,maxU=M.lastPull?Date.parse(M.lastPull):0;
  docs.forEach(doc=>{
    const wk=lastSeg(doc.name);
    if(doc.updateTime)M.wkTime[wk]=doc.updateTime;
    const d=fsObj(doc.fields);
    if(d.u){const t=Date.parse(d.u);if(t>maxU)maxU=t;}
    const x=d.x||{};
    Object.keys(x).forEach(id=>{const t=x[id]||{};const cur=S.dead[id];if(!cur||(t.u||0)>(cur.u||0))S.dead[id]={u:t.u||0,k:t.k||'',yt:t.yt||''};});
    let legacy=false;
    const e=d.e||{};
    Object.keys(e).forEach(dk=>(e[dk]||[]).forEach(ev=>{
      if(!ev||!ev.id)return;
      if(!d.v&&isData(ev.thumb))legacy=true;
      if(mergeEv(ev,dk,idx))changed=true;
    }));
    const s=d.s||{},su=d.su||{};
    Object.keys(s).forEach(dk=>{
      const cu=su[dk]||0,lu=S.su[dk]||0,arr=s[dk]||[];
      if(cu>lu||(cu===0&&lu===0&&(!S.stickers[dk]||S.stickers[dk].length<arr.length))){
        if(JSON.stringify(S.stickers[dk]||[])!==JSON.stringify(arr)){S.stickers[dk]=arr;changed=true;}
        S.su[dk]=cu;
      }
    });
    // 旧形式（サムネ埋め込み）の週は一度だけ新形式で書き直す → 次回から軽い
    if(legacy)M.dirty[wk]=(M.dirty[wk]||0)+1;
  });
  Object.keys(S.dead).forEach(id=>{
    const dk=idx.get(id);if(dk===undefined)return;
    const list=S.events[dk];const i=list.findIndex(v=>v.id===id);
    if(i>=0&&(list[i].u||0)<=S.dead[id].u){list.splice(i,1);idx.delete(id);changed=true;}
  });
  if(maxU)M.lastPull=new Date(maxU).toISOString();
  return changed;
}

// ===== 取得 =====
async function pull(full){
  const uid=getUserId();
  let docs,changed=false;
  if(full){
    // 週の名前だけ先に（軽い）→ 新しい週から3週ずつ取得。届いた分からすぐ表示・保存
    const names=(await fsList('diaries/'+uid+'/weeks',['v'])).map(d=>d.name).sort().reverse();
    docs=[];
    for(let i=0;i<names.length;i+=3){
      const pg=await fsBatchGet(names.slice(i,i+3));
      docs=docs.concat(pg);
      if(applyDocs(pg)){changed=true;softRender();}
      persistLocal();
      setCloudStatus('loading',Math.min(i+3,names.length)+'/'+names.length+'wk');
    }
  }else{
    docs=await fsChangedWeeks(uid,M.lastPull||'1970-01-01T00:00:00Z');
    changed=applyDocs(docs);
  }
  const need=new Set();
  if(full){
    // クラウドに無い週（この端末だけのデータ）は送る
    const have=new Set(docs.map(d=>lastSeg(d.name)));
    Object.keys(S.events).forEach(dk=>{if(S.events[dk]&&S.events[dk].length&&!have.has(dayKey2WeekKey(dk)))markDirty(dk);});
    const th=await fsList('diaries/'+uid+'/thumbs',['h']);
    const cloudTh=new Set();
    th.forEach(d=>{const id=lastSeg(d.name);cloudTh.add(id);const h=d.fields&&d.fields.h&&d.fields.h.stringValue;if(h)M.thumbsUp[id]=h;});
    Object.values(S.events).forEach(l=>(l||[]).forEach(ev=>{if(!ev.thumb&&cloudTh.has(ev.id))need.add(ev.id);}));
    M.fullAt=Date.now();
  }
  Object.values(S.events).forEach(l=>(l||[]).forEach(ev=>{if(ev.th&&!isData(ev.thumb))need.add(ev.id);}));
  if(need.size){
    try{if(await fetchThumbs(uid,[...need]))changed=true;}catch(e){console.warn('thumbs',e);}
  }
  persistLocal();
  return changed;
}
async function fetchThumbs(uid,ids){
  let changed=false;
  const idx=eventIndex();
  ids.sort((a,b)=>String(idx.get(b)).localeCompare(String(idx.get(a))));   // 新しい日から
  for(let i=0;i<ids.length;i+=4){
    const found=await fsBatchGet(ids.slice(i,i+4).map(id=>docName('diaries',uid,'thumbs',id)));
    let got=false;
    found.forEach(doc=>{
      const id=lastSeg(doc.name),f=fsObj(doc.fields),dk=idx.get(id);
      if(!f.t||dk===undefined)return;
      const ev=S.events[dk].find(v=>v.id===id);
      if(!ev||isData(ev.thumb))return;
      ev.thumb=f.t;ev.th=f.h||ev.th||hashStr(f.t);M.thumbsUp[id]=f.h||'';
      got=changed=true;
    });
    if(got){softRender();persistLocal();}
  }
  return changed;
}

// ===== 送信（週ドキュメント単位。更新時刻の前提条件で他端末の変更を上書きしない） =====
function groupByWeek(){
  const g={};const G=wk=>g[wk]||(g[wk]={e:{},s:{},su:{},x:{}});
  Object.keys(S.events).forEach(dk=>{const l=S.events[dk];if(l&&l.length)G(dayKey2WeekKey(dk)).e[dk]=l;});
  Object.keys(S.stickers).forEach(dk=>{const o=G(dayKey2WeekKey(dk));o.s[dk]=S.stickers[dk]||[];o.su[dk]=S.su[dk]||0;});
  Object.keys(S.dead).forEach(id=>{const t=S.dead[id];if(t.k)G(dayKey2WeekKey(t.k)).x[id]=t;});
  return g;
}
function chunks(writes,maxBytes,maxN){
  const out=[];let cur=[],size=0;
  writes.forEach(w=>{
    const n=JSON.stringify(w).length;
    if(cur.length&&(size+n>maxBytes||cur.length>=maxN)){out.push(cur);cur=[];size=0;}
    cur.push(w);size+=n;
  });
  if(cur.length)out.push(cur);
  return out;
}
async function push(){
  const uid=getUserId();
  for(let attempt=0;attempt<3;attempt++){
    const wks=Object.keys(M.dirty);
    if(!wks.length)return;
    const seq={};wks.forEach(wk=>seq[wk]=M.dirty[wk]);
    const g=groupByWeek();
    const thumbW=[],thumbH={},weekW=[];
    wks.forEach(wk=>{
      const o=g[wk]||{e:{},s:{},su:{},x:{}};
      const e={};
      Object.keys(o.e).forEach(dk=>{e[dk]=o.e[dk].map(ev=>{
        if(!isData(ev.thumb))return ev;
        if(!ev.th)ev.th=hashStr(ev.thumb);
        if(M.thumbsUp[ev.id]!==ev.th){
          thumbW.push({update:{name:docName('diaries',uid,'thumbs',ev.id),fields:fsFields({t:ev.thumb,h:ev.th})}});
          thumbH[ev.id]=ev.th;
        }
        const {thumb,...rest}=ev;return rest;
      });});
      weekW.push({wk,w:{update:{name:docName('diaries',uid,'weeks',wk),fields:fsFields({v:2,e,s:o.s,su:o.su,x:o.x})},
        updateTransforms:[{fieldPath:'u',setToServerValue:'REQUEST_TIME'}],
        currentDocument:M.wkTime[wk]?{updateTime:M.wkTime[wk]}:{exists:false}}});
    });
    // サムネを先に（週ドキュメントが参照するので）
    for(const c of chunks(thumbW,1e6,6)){
      await fsRetry(()=>fsCommit(c));
      c.forEach(w=>{const id=lastSeg(w.update.name);M.thumbsUp[id]=thumbH[id];});
    }
    let conflict=null;
    for(const c of chunks(weekW,1e6,100)){
      try{
        const r=await fsRetry(()=>fsCommit(c.map(x=>x.w)));
        (r.writeResults||[]).forEach((wr,i)=>{
          const wk=c[i].wk;
          M.wkTime[wk]=wr.updateTime;
          if(M.dirty[wk]===seq[wk])delete M.dirty[wk];
        });
      }catch(e){
        if(['FAILED_PRECONDITION','ALREADY_EXISTS','NOT_FOUND','ABORTED'].includes(e.code)){conflict=c;break;}
        throw e;
      }
    }
    persistLocal();
    if(!conflict)return;
    // 他端末が先に書いた週：最新を取ってマージしてから再送
    const docs=await fsBatchGet(conflict.map(x=>docName('diaries',uid,'weeks',x.wk)));
    const got=new Set(docs.map(d=>lastSeg(d.name)));
    conflict.forEach(x=>{if(!got.has(x.wk))delete M.wkTime[x.wk];});
    if(applyDocs(docs))softRender();
  }
  const er=new Error('conflict');er.code='conflict';throw er;
}

// ===== 同期の実行（1本ずつ順番に） =====
let syncChain=Promise.resolve(),syncQueued=null,pulledOnce=false,lastSyncAt=0,retryN=0,retryTimer=null;
function syncNow(o){
  o=Object.assign({pull:true,full:false},o||{});
  if(syncQueued){syncQueued.pull=syncQueued.pull||o.pull;syncQueued.full=syncQueued.full||o.full;return syncQueued.p;}
  const q={pull:o.pull,full:o.full};
  syncQueued=q;
  q.p=syncChain=syncChain.then(()=>{syncQueued=null;return doSync(q);});
  return q.p;
}
async function doSync(q){
  if(retryTimer){clearTimeout(retryTimer);retryTimer=null;}
  if(navigator.onLine===false){setCloudStatus('offline');return{ok:false,code:'offline'};}
  try{
    if(q.pull){
      const needFull=q.full||!M.fullAt||Date.now()-M.fullAt>FULL_EVERY;
      setCloudStatus('loading');
      if(M.fullAt&&await pull(false))softRender();
      if(needFull&&await pull(true))softRender();
      pulledOnce=true;lastSyncAt=Date.now();
      if(feed&&applyFeedAll(feed))softRender();
    }
    if(Object.keys(M.dirty).length){
      setCloudStatus('syncing',Object.keys(M.dirty).length+'wk');
      await push();
    }
    retryN=0;
    setCloudStatus('synced');
    return{ok:true};
  }catch(e){
    console.error('sync',e);
    setCloudStatus(navigator.onLine===false?'offline':'error',e.code||'');
    const wait=[5,15,45,120][Math.min(retryN++,3)]*1000;
    retryTimer=setTimeout(()=>syncNow(),wait);
    return{ok:false,code:e.code||e.message};
  }
}
let pendingRefresh=false;

  // 入力中のフォームや削除確認は消さない（閉じた時に描き直す）

  if(typeof refresh==='function')refresh();
}

let feed=null,feedAt=0;
const STREAM_TYPES=['zatsudan','game_single','game_series','collab','event'];
const hm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const dkOf=d=>dk(d.getFullYear(),d.getMonth(),d.getDate());
const ytThumb=id=>'https://i.ytimg.com/vi/'+id+'/mqdefault.jpg';

// 手で触っていない自動追加分
const pristine=ev=>!ev.watched&&!ev.note&&!ev.price&&!ev.ytLock;
function findManual(st,used){
  let best=null,bd=181;
  [-1,0,1].forEach(off=>{
    const day=dkOf(new Date(st.getTime()+off*864e5));
    (S.events[day]||[]).forEach(ev=>{
      if(ev.yt||used.has(ev.id)||!STREAM_TYPES.includes(ev.type))return;
      if(!ev.time&&off!==0)return;
      const d=ev.time?Math.abs(new Date(day+'T'+ev.time)-st)/60000:180;
      if(d<bd){bd=d;best={ev,dk:day};}
    });
  });
  return best;
}
/* 配信の長さを予定に記録（streams.json は90日で消えるので予定側に残す）／登録者が1000人増えるごとに記念日を追加 */
function applyExtras(f){
  let changed=false;const items=(f&&f.items)||[],by=new Map(items.map(it=>[it.id,it])),idx=eventIndex();
  Object.keys(S.events).forEach(k=>(S.events[k]||[]).forEach(ev=>{
    if(!ev||!ev.yt)return;const it=by.get(ev.yt);if(!it||!it.end||it.status!=='none')return;
    const d=Math.round((Date.parse(it.end)-Date.parse(it.start))/6e4);
    if(d>0&&d<24*60&&ev.dur!==d){ev.dur=d;ev.u=Date.now();markDirty(k);changed=true;}}));
  const su=f&&f.subs,unit=(su&&su.unit)||0;
  (unit?(su.milestones||[]):[]).forEach(m=>{
    const id='subs-'+m.n*unit;if(S.dead[id]||idx.has(id))return;const t=new Date(m.at);if(isNaN(t))return;const k=dkOf(t);
    const v=m.n*unit,lbl=v>=1e4?`${+(v/1e4).toFixed(2)}万人`:`${v.toLocaleString('ja-JP')}人`;
    (S.events[k]=S.events[k]||[]).push({id,type:'anniversary',title:`チャンネル登録者 ${lbl}`,time:hm(t),note:'',gameTitle:'',collab:'',watched:true,price:'',thumb:'',u:Date.now()});
    idx.set(id,k);markDirty(k);changed=true;});
  return changed;}
function applyFeedAll(f){const a=applyFeed(f),b=applyExtras(f);return a||b;}
function applyFeed(f){
  const items=(f&&f.items)||[];
  if(!items.length)return false;
  if(!M.ytSince)M.ytSince=dkOf(new Date(Date.now()-14*864e5));
  const now=Date.now();
  let changed=false;
  const touch=k=>{markDirty(k);changed=true;};
  const byYt=new Map();
  Object.keys(S.events).forEach(k=>(S.events[k]||[]).forEach(ev=>{if(ev.yt){if(!byYt.has(ev.yt))byYt.set(ev.yt,[]);byYt.get(ev.yt).push({ev,dk:k});}}));
  const deadYt=new Set(Object.values(S.dead).map(t=>t.yt).filter(Boolean));
  const used=new Set(),ids=new Set(items.map(it=>it.id));
  // シリーズ（part違い）のゲーム名：自分で直した／手入力したものを最優先で引き継ぐ
  const skGame={};
  Object.keys(S.events).sort().forEach(k=>(S.events[k]||[]).forEach(ev=>{
    if(!ev.sk||!ev.gameTitle)return;
    const rank=ev.ytLock?2:1,cur=skGame[ev.sk];
    if(!cur||rank>=cur.rank)skGame[ev.sk]={rank,game:ev.gameTitle};
  }));
  const gameOf=it=>{const g=it.sk&&skGame[it.sk];return (g&&g.rank===2&&g.game)||it.game||(g&&g.game)||'';};
  // 古い回から：紐付けた手入力のゲーム名が、同じ回のうちに後の回へ伝わる
  items.slice().sort((a,b)=>String(a.start).localeCompare(String(b.start))).forEach(it=>{
    const st=new Date(it.start);
    if(isNaN(st))return;
    const day=dkOf(st),time=hm(st);
    if(day<M.ytSince)return;
    const hits=byYt.get(it.id)||[];
    const auto=hits.find(x=>x.ev.id==='yt-'+it.id);
    let linked=hits.find(x=>x.ev.id!=='yt-'+it.id);
    if(!linked&&(!auto||pristine(auto.ev))){
      // 同じ配信を手入力していたら、新しく足さずにそれに紐付ける
      const cand=findManual(st,used);
      if(cand){
        const ev=cand.ev;
        ev.yt=it.id;ev.ytLock=true;ev.u=now;
        if(it.sk&&!ev.sk)ev.sk=it.sk;
        if(!ev.time)ev.time=time;
        if(!ev.thumb)ev.thumb=ytThumb(it.id);
        if(!ev.gameTitle&&gameOf(it)&&(ev.type==='game_single'||ev.type==='game_series'))ev.gameTitle=gameOf(it);
        if(ev.sk&&ev.gameTitle)skGame[ev.sk]={rank:2,game:ev.gameTitle};
        used.add(ev.id);linked=cand;touch(cand.dk);
      }
    }
    if(linked){
      if(auto&&pristine(auto.ev)){killEvent(auto.dk,auto.ev.id,true);touch(auto.dk);}
      return;
    }
    if(!auto&&deadYt.has(it.id))return;
    const want={type:it.type||'zatsudan',title:it.title,time,gameTitle:gameOf(it),collab:it.collab||'',thumb:ytThumb(it.id),sk:it.sk||''};
    if(auto){
      const ev=auto.ev;
      if(ev.ytLock)return;
      const diff=Object.keys(want).some(k=>(ev[k]||'')!==want[k]);
      if(!diff&&auto.dk===day)return;
      Object.assign(ev,want,{u:now});
      if(auto.dk!==day){
        S.events[auto.dk]=S.events[auto.dk].filter(x=>x!==ev);
        (S.events[day]=S.events[day]||[]).push(ev);
        touch(auto.dk);
      }

/* ---------- text scramble engine ---------- */
const SCR='#%&@*+=-:<>/\\|~^';
const jobs=new Map();let scrRun=false;
function scramble(el,text,{dur=300,delay=0}={}){
  text=String(text);
  if(RM()){jobs.delete(el);el.textContent=text;return;}
  const start=performance.now()+delay,chars=[...text];
  const settle=chars.map(()=>start+dur*(.3+.7*Math.random()));
  jobs.set(el,{chars,start,settle,end:Math.max(start,...settle)});
  if(!scrRun){scrRun=true;requestAnimationFrame(scrTick);}
}
function scrTick(now){
  for(const [el,j] of jobs){
    if(now<j.start)continue;
    let s='';for(let i=0;i<j.chars.length;i++){const c=j.chars[i];s+=(now>=j.settle[i]||c===' '||c==='\n')?c:SCR[(Math.random()*SCR.length)|0];}
    el.textContent=s;
    if(now>=j.end){el.textContent=j.chars.join('');jobs.delete(el);}
  }
  if(jobs.size)requestAnimationFrame(scrTick);else scrRun=false;
}

const field=(()=>{
  const cv=$('#field'),ctx=cv.getContext('2d'),RAMP=' .,:;-=+*#%@',CW=9,CH=14;
  let W=0,H=0,dpr=1,cols=0,rows=0,ripples=[],looping=false,t=0,scrollOff=0;
  let reveal=1,spread=0,anims=0; // spread 1 = whole screen (boot), 0 = top/bottom bands
  function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cols=Math.ceil(W/CW)+1;rows=Math.ceil(H/CH)+1;draw(performance.now());}
  function band(a){let m=0;if(a<.42)m=Math.pow(1-a/.42,1.4);else if(a>.8)m=Math.pow((a-.8)/.2,1.6)*.55;return m;}

    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.font=`500 12px ${MONO_STACK}`;ctx.textBaseline='top';
    ripples=ripples.filter(r=>now-r.t0<1100);
    const B=[[],[],[],[],[],[],[]];
    const so=scrollOff,tt=t;
    for(let r=0;r<rows;r++){
      const y=r*CH,a=y/H;
      const rv=Math.max(0,Math.min(1,reveal*rows*1.25-r));
      let m=(band(a)*(1-spread)+.32*spread)*rv;
      const hasR=ripples.length>0;
      if(m<.015&&!hasR)continue;
      for(let c=0;c<cols;c++){
        const x=c*CW,nx=c*.21,ny=(r+so)*.17;
        let v=(Math.sin(nx+tt*.7)+Math.sin(ny*1.3-tt*.5)+Math.sin((nx+ny)*.6+tt*.3)+Math.sin(Math.hypot(nx-5,ny-3)*.9-tt*.8))/8+.5;
        let acc=0;
        if(hasR)for(const p of ripples){const q=(now-p.t0)/1100,rad=q*380,d=Math.hypot(x-p.x,y-p.y);acc+=Math.exp(-(((d-rad)/24)**2))*(1-q);}
        const al=m*(.1+.5*v)+acc*.42;
        if(al<.03)continue;

        if(ch===' ')continue;

      }
    }
    for(let i=0;i<7;i++){const b=B[i];if(!b.length)continue;ctx.fillStyle=`rgba(${THC.field},${((i+1)/13*THC.fa).toFixed(3)})`;for(let k=0;k<b.length;k+=3)ctx.fillText(b[k],b[k+1],b[k+2]);}
  }
  function loop(now){
    if(!RM())t+=.012;

    if(ripples.length||anims>0){requestAnimationFrame(loop);}else looping=false;
  }
  function kick(){if(!looping){looping=true;requestAnimationFrame(loop);}}
  function ripple(x,y){if(RM())return;ripples.push({x,y,t0:performance.now()});kick();}
  function setScroll(v){scrollOff=v;if(!looping)requestAnimationFrame(n=>draw(n));}
  function tween(set,from,to,dur,ease=q=>1-Math.pow(1-q,3)){return new Promise(res=>{if(RM()){set(to);draw(performance.now());return res();}
    const t0=performance.now();anims++;kick();const f=now=>{const q=Math.min(1,(now-t0)/dur);set(from+(to-from)*ease(q));if(q<1)requestAnimationFrame(f);else{anims--;res();}};requestAnimationFrame(f);});}
  return{resize,ripple,setScroll,redraw:()=>draw(performance.now()),
    bootIn:(dur)=>{spread=1;return tween(v=>reveal=v,0,1,dur,q=>q);},
    settle:(dur)=>tween(v=>spread=v,1,0,dur),
    set:(r,s)=>{reveal=r;spread=s;draw(performance.now());}};
})();

const SRC=new Map(); // サムネ → 表示に使う画像（灰色・緑一色のプレースホルダーは差し替え）

    im.onload=()=>done(isFlat(im)?fallbackThumb(e):t);

    const u=c.toDataURL('image/jpeg',q);if(u.length*.75>TARGET){if(q>.4){q-=.1;return go();}if(maxDim>240){maxDim-=60;q=.7;return go();}}res(u);};go();};im.src=r.result;};r.readAsDataURL(file);});}

/* ---------- ASCII cat ---------- */
const MIR={'(':')',')':'(','[':']',']':'[','/':'\\','\\':'/','<':'>','>':'<'};
const mirror=s=>[...s].reverse().map(c=>MIR[c]||c).join('');
function catLines(eyes='o.o',walk=0,flip=false){
  /* plain art faces left (tail on the right). walking = the two paws lift in turn (see #catArt .pw) */
  let L=[' /\\_/\\       ',`( ${eyes} )      `,' (")(")~~=[] '];
  return flip?L.map(mirror):L;
}
const cat=(()=>{
  const el=$('#cat'),art=$('#catArt'),bub=$('#bubble'),tb=$('#tabbar');
  const SEAT=10;
  let x=SEAT,tx=SEAT,eyes='o.o',walkF=0,left=false,walking=false,perched=null,mode='seat',bubT=0,faceT=0,backT=0,lastStep=0,onArrive=null;
  const draw=()=>{const L=catLines(eyes,0,left);if(!walking){art.textContent=L.join('\n');return;}
    let n=0;art.innerHTML=esc(L[0])+'\n'+esc(L[1])+'\n'+esc(L[2]).replace(/\(&quot;\)/g,m=>`<span class="pw${n++===walkF?' up':''}">${m}</span>`);};
  function geo(){const vw=document.documentElement.clientWidth,w=tb.offsetWidth,h=tb.offsetHeight;return{left:(vw-w)/2,gap:parseFloat(getComputedStyle(tb).bottom)||18,w,h};}
  function place(){if(perched)return;const g=geo();el.style.left=(g.left+x)+'px';
    el.style.bottom=(mode==='seat'?g.gap+(g.h-el.offsetHeight)/2:g.gap+g.h-5)+'px';}
  function setMode(m){if(mode===m)return;mode=m;if(!RM()){el.classList.add('moving');setTimeout(()=>el.classList.remove('moving'),440);}place();}
  function face(e,ms){eyes=e;draw();clearTimeout(faceT);if(ms)faceT=setTimeout(()=>{eyes='o.o';draw();},ms);}
  let bubRaf=0,walkT=0;
  function posBub(){const r=art.getBoundingClientRect(),bw=bub.offsetWidth;bub.style.left=Math.max(10,Math.min(innerWidth-bw-10,r.left+r.width/2-bw*.3))+'px';bub.style.top=(r.top-bub.offsetHeight-10)+'px';}
  function follow(){posBub();bubRaf=bub.classList.contains('on')?requestAnimationFrame(follow):0;}
  function say(text){bub.textContent=text;posBub();bub.classList.add('on');
    cancelAnimationFrame(bubRaf);bubRaf=requestAnimationFrame(follow);
    clearTimeout(bubT);bubT=setTimeout(()=>bub.classList.remove('on'),2200);}
  function hop(){if(RM())return;el.classList.remove('hop');el.offsetWidth;el.classList.add('hop');}
  function walkTo(nx,done){if(perched)return;tx=nx;onArrive=done||null;if(RM()){x=nx;place();onArrive&&onArrive();return;}if(!walking){walking=true;requestAnimationFrame(step);}}

    x+=Math.sign(d)*Math.min(Math.abs(d),dt*.05);

  }
  function goSeat(){walkTo(SEAT,()=>{setMode('seat');hop();});}
  el.addEventListener('click',()=>{
    face('O.O',380);hop();say(NEKOSAY[(Math.random()*NEKOSAY.length)|0]);
    if(perched)return;
    clearTimeout(backT);setMode('edge');
    const max=tb.offsetWidth-el.offsetWidth-4;
    clearTimeout(walkT);walkT=setTimeout(()=>walkTo(Math.max(SEAT,40+Math.random()*(max-40)),()=>{backT=setTimeout(goSeat,2600);}),420);
  });
  (function blink(){setTimeout(()=>{if(eyes==='o.o'&&!walking)face('-.-',140);blink();},2800+Math.random()*3200);})();
  addEventListener('resize',place);
  draw();
  return{el,art,draw,place,face,say,hop,
    react(e,text){face(e,1400);hop();setTimeout(()=>say(text),120);},
    perch(sheet){clearTimeout(backT);clearTimeout(walkT);perched=sheet;walking=false;x=SEAT;mode='seat';el.classList.add('perched');sheet.append(el);eyes='o.o';left=false;draw();},
    home(){if(!perched)return;perched=null;
      setTimeout(()=>{if(perched)return;el.classList.remove('perched');body.append(el);place();hop();},RM()?0:420);}};
})();

/* ---------- boot sequence ---------- */
async function runBoot(full,ready=Promise.resolve()){
  const readyOrTimeout=Promise.race([ready,new Promise(r=>setTimeout(r,3500))]);
  const boot=$('#boot'),bc=$('#bootCat'),log=$('#bootLog'),msg=$('#bootMsg'),hint=$('#bootHint');
  if(stack.length)stack.slice().reverse().forEach(s=>s.close());
  body.classList.remove('boot-in');body.classList.add('booting');boot.hidden=false;boot.style.opacity='';
  bc.getAnimations().forEach(a=>a.cancel());bc.style.transform='';bc.style.opacity='';
  log.innerHTML='';msg.textContent='';hint.style.opacity='0';
  let skipped=false;const skip=()=>{skipped=true;};boot.addEventListener('pointerdown',skip,{once:true});
  const wait=ms=>new Promise(r=>{const t0=performance.now();const f=()=>{if(skipped||performance.now()-t0>=ms)r();else requestAnimationFrame(f);};f();});

  // cat assembles from falling characters
  bc.innerHTML='';
  catLines('o.o').forEach(ln=>{const row=mk('span','row');[...ln].forEach(ch=>{const s=mk('span','',ch===' '?'&nbsp;':esc(ch));
    if(ch!==' '&&full&&!RM()){s.classList.add('drop');s.style.animationDelay=((Math.random()*560)|0)+'ms';}row.append(s);});bc.append(row);});

  if(RM()){body.classList.add('boot-in');field.set(1,0);msg.textContent='おかえり、仲磨';await wait(450);await readyOrTimeout;return exitBoot();}
  field.bootIn(full?900:260);requestAnimationFrame(()=>body.classList.add('boot-in'));
  setTimeout(()=>hint.style.opacity='1',700);

  if(full){
    const line=mk('div');log.append(line);
    await wait(380);
    for(const ch of '通信ケーブル、接続中'){if(skipped)break;line.textContent+=ch;await wait(34);}
    line.textContent='通信ケーブル、接続中';
    const bar=mk('div','bar'),ab=mk('div','abar pink'),pct=mk('span','pct','0%');bar.append(ab,pct);log.append(bar);
    abar(ab,20,1);const spans=[...ab.children];spans.forEach(s=>s.style.transitionDelay='0ms');ab.classList.add('go');spans.forEach(s=>s.classList.remove('f'));
    let done=0;const tasks=[document.fonts?document.fonts.ready:Promise.resolve(),readyOrTimeout,readyOrTimeout.then(()=>new Promise(r=>{const x=recentWithImage(allEv());if(x)resolveSrc(x.e).then(r);else r();setTimeout(r,1500);}))];
    tasks.forEach(p=>p.then(()=>done++));
    const t0=performance.now();
    await new Promise(res=>{const f=()=>{const tp=Math.min(1,(performance.now()-t0)/950),real=done/tasks.length;
      const p=skipped?1:Math.min(tp,.35+.65*real,1);const k=Math.round(p*20);spans.forEach((s,i)=>s.classList.toggle('f',i<k));pct.textContent=Math.round(p*100)+'%';
      if(p>=1)res();else requestAnimationFrame(f);};f();});
    const ok=mk('div','','仲磨ID　ok');log.append(ok);
  }
  // happy face + greeting
  const eyeRow=bc.children[1];const eyesSpans=[...eyeRow.children].slice(2,5);
  ['^','.','^'].forEach((c,i)=>eyesSpans[i].textContent=c);
  scramble(msg,'おかえり、仲磨',{dur:420});
  await wait(full?700:420);
  await readyOrTimeout;
  return exitBoot();
}

function fontsReady(ms=2500){const gf=document.querySelector('link[href*="fonts.googleapis.com/css2"]');
  const sheet=new Promise(r=>{if(!gf||gf.media!=='print')r();else{gf.addEventListener('load',r,{once:true});gf.addEventListener('error',r,{once:true});}});
  const all=sheet.then(()=>document.fonts?Promise.all(FONT_PROBE.map(f=>document.fonts.load(f[0],f[1]).catch(()=>{}))):0);
  return Promise.race([all,new Promise(r=>setTimeout(r,ms))]);}
async function exitBoot(){
  await fontsReady();
  const boot=$('#boot'),bc=$('#bootCat'),log=$('#bootLog'),msg=$('#bootMsg'),hint=$('#bootHint');
  hint.style.opacity='0';
  cat.place();cat.face('o.o');cat.el.style.visibility='hidden';
  body.classList.remove('booting','boot-in');
  updHead(true);paintGrid({decode:true});renderHero();
  liquid(tabInd,tabs.find(t=>t.getAttribute('aria-selected')==='true'));
  liquid(pillInd,pillsEl.querySelector('[aria-checked="true"]'));
  if(RM()){boot.hidden=true;cat.el.style.visibility='';field.set(1,0);return;}
  field.settle(900);
  [log,msg].forEach(el=>el.animate([{opacity:1},{opacity:0,filter:'blur(4px)'}],{duration:260,fill:'forwards'}));
  await raf();
  const from=bc.getBoundingClientRect(),to=cat.art.getBoundingClientRect();
  const s=to.height/from.height;
  const a=bc.animate([{transform:'none'},{transform:`translate(${to.left-from.left}px,${to.top-from.top}px) scale(${s})`}],{duration:700,easing:SP,fill:'forwards'});
  await a.finished;
  cat.el.style.visibility='';cat.hop();
  boot.hidden=true;[log,msg].forEach(el=>el.getAnimations().forEach(x=>x.cancel()));a.cancel();
}

function refresh(){
  if(body.classList.contains('booting'))return;
  updHead(false);paintGrid();renderHero();
  if(daySheet.isOpen&&sel)fillDay(sel,{soft:true});
  if(curView==='log'&&!stack.length){const st=monthStats(view.y,view.m),sig=JSON.stringify(st);if(refresh.log!==sig){refresh.log=sig;renderLog();playLog();}}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();syncSub();}});
